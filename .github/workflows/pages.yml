name: Deploy to GitHub Pages

# Manual only. The live site runs on Railway (see README), so this workflow has
# no job to do on a normal push — and until someone turns Pages on by hand it
# cannot succeed anyway, so leaving it on push just painted every commit red.
#
# If you ever want static hosting as well: enable Pages at
#   Settings -> Pages -> Source: GitHub Actions
# then run this from the Actions tab. Note the app is a server now; static
# hosting serves the front end but needs Supabase for the shared board.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pages must be switched on by a human first; GITHUB_TOKEN cannot do it.
      # Creating a Pages site needs admin rights the Actions token is never
      # granted, which is why enablement returns "Resource not accessible by
      # integration" rather than helping.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
