name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is currently claude/gallant-brahmagupta-wf1kip,
    # so `main` alone would never fire. Both are listed: rename the branch to
    # main in GitHub whenever you like and this keeps working either way.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: Pages must be switched on by a human once, at
      #   Settings -> Pages -> Source: GitHub Actions
      # Until that is done every run here fails on this step with "Get Pages
      # site failed". GITHUB_TOKEN cannot do it: creating a Pages site needs
      # admin rights the Actions token is never granted, and asking for it
      # returns "Resource not accessible by integration". The flag below is
      # only useful afterwards, to re-enable Pages if it is ever turned off.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
