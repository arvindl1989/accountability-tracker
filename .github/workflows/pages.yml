name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is currently claude/gallant-brahmagupta-wf1kip,
    # so `main` alone would never fire. Both are listed: rename the branch to
    # main in GitHub whenever you like and this keeps working either way.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement turns Pages on via the API if it is off, which saves a trip to
      # repo settings. It needs the pages:write permission granted above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
