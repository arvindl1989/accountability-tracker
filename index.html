<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Accountability Club</title>
<meta name="description" content="Daily accountability tracker for Arvind, Abhinandh and Sai — steps, weight, workouts, habits and streaks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23f97316'/%3E%3Cpath d='M28 62 L44 44 L56 54 L74 32' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24"/><path d="M28 62 L44 44 L56 54 L74 32" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-text">
        <strong>Accountability Club</strong>
        <small id="brandSub">Arvind · Abhinandh · Sai</small>
      </span>
    </div>
    <div class="topbar-right">
      <div class="whoami" id="whoami" role="group" aria-label="Who is using the app"></div>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist">
  <div class="wrap tabs-inner">
    <button class="tab is-active" data-view="today" role="tab">Today</button>
    <button class="tab" data-view="board" role="tab">Board</button>
    <button class="tab" data-view="trends" role="tab">Trends</button>
    <button class="tab" data-view="settings" role="tab">Settings</button>
  </div>
</nav>

<main class="wrap" id="view" role="main"></main>

<footer class="wrap foot">
  <span id="syncStatus" class="sync-pill" title="Data storage status"></span>
  <span class="foot-note">Built for the three of us. Show up, log it, repeat.</span>
</footer>

<div class="toast-host" id="toastHost" aria-live="polite"></div>

<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
